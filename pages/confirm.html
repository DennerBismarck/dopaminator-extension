<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Confirmar acesso - Dopaminator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      text-align: center;
      max-width: 480px;
      padding: 48px 32px;
    }
    .icon { font-size: 72px; margin-bottom: 24px; }
    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #e0e0e0;
      line-height: 1.4;
    }
    .domain {
      font-size: 22px;
      color: #e94560;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 15px;
      color: #888;
      margin-bottom: 40px;
    }
    .buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
    }
    .btn {
      border: none;
      border-radius: 8px;
      padding: 12px 32px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-no {
      background: #16213e;
      color: #e0e0e0;
      border: 1px solid #0f3460;
    }
    .btn-no:hover { background: #0f3460; }
    .btn-yes {
      background: #e94560;
      color: white;
    }
    .btn-yes:hover { background: #c73652; }
    .hint {
      margin-top: 24px;
      font-size: 12px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">&#x1F9E0;</div>
    <h1>Voce quer mesmo ir para</h1>
    <div class="domain" id="domain"></div>
    <div class="subtitle">Isso vai te ajudar? Tem certeza?</div>
    <div class="buttons">
      <button class="btn btn-no" id="no-btn">&larr; Nao, voltar</button>
      <button class="btn btn-yes" id="yes-btn">Sim, continuar &rarr;</button>
    </div>
    <div class="hint">Se continuar, o acesso ficara liberado por 30 minutos.</div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const domain = params.get('domain') || '';
    const returnUrl = params.get('return') || '';

    document.getElementById('domain').textContent = domain;

    document.getElementById('yes-btn').addEventListener('click', async () => {
      document.getElementById('yes-btn').disabled = true;
      document.getElementById('yes-btn').textContent = 'Aguarde...';
      await chrome.runtime.sendMessage({ type: 'confirm_allow', domain });
      window.location.href = returnUrl;
    });

    document.getElementById('no-btn').addEventListener('click', () => {
      if (history.length > 1) {
        history.back();
      } else {
        window.close();
      }
    });
  </script>
</body>
</html>
